name: Posts LinkedIn
on:
  schedule:
    - cron: "5 8,9 * * *"   # 10h05 à Paris (été comme hiver, le script ne publie qu'après 10h)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/linkedin_flux.py
      - run: |
          git config user.name "clefora-bot"
          git config user.email "actions@users.noreply.github.com"
          git add linkedin/flux.xml
          git diff --cached --quiet || (git commit -m "Post LinkedIn du jour" && git push)
