name: Posts LinkedIn
on:
  schedule:
    # GitHub retarde souvent les crons de plusieurs heures (runs vus vers 15-16h UTC) :
    # on tente toutes les 30 min de 9h à 18h Paris ; le script ne publie qu'après 10h et ne commite que si le flux change.
    - cron: "17,47 7-17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/linkedin_flux.py
      - run: |
          git config user.name "clefora-bot"
          git config user.email "actions@users.noreply.github.com"
          git add linkedin/flux.xml
          git diff --cached --quiet || (git commit -m "Post LinkedIn du jour" && git push)
